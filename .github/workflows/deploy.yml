name: Deploy

on:
  push:
    branches: [main, dev]

concurrency:
  group: deploy-${{ github.ref }}
  cancel-in-progress: true

jobs:
  deploy-cdk:
    runs-on: ubuntu-latest
    outputs:
      ai_playground_url: ${{ steps.cdk-deploy.outputs.ai_playground_url }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: infra/package-lock.json

      - name: Install CDK dependencies
        run: npm ci
        working-directory: infra

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ github.ref == 'refs/heads/main' && secrets.AWS_ACCESS_KEY_ID_PROD || secrets.AWS_ACCESS_KEY_ID_GW }}
          aws-secret-access-key: ${{ github.ref == 'refs/heads/main' && secrets.AWS_SECRET_ACCESS_KEY_PROD || secrets.AWS_SECRET_ACCESS_KEY_GW }}
          aws-region: eu-central-1

      - name: CDK deploy
        id: cdk-deploy
        run: |
          GITHUB_TOKEN=${{ secrets.GH_PAT_SCHEDULER }} npx cdk deploy -c env=${{ github.ref == 'refs/heads/main' && 'prod' || 'gw' }} --require-approval never --outputs-file cdk-outputs.json
          echo "ai_playground_url=$(jq -r '.ContactApiStack.AiPlaygroundUrl // empty' cdk-outputs.json)" >> "$GITHUB_OUTPUT"
        working-directory: infra

  deploy-vercel:
    needs: deploy-cdk
    runs-on: ubuntu-latest
    env:
      VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
      VERCEL_ORG_ID: ${{ secrets.VERCEL_ORG_ID }}
      VERCEL_PROJECT_ID: ${{ secrets.VERCEL_PROJECT_ID }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Install Vercel CLI
        run: npm install -g vercel

      - name: Pull Vercel environment
        run: vercel pull --yes --token=$VERCEL_TOKEN

      - name: Build (production)
        if: github.ref == 'refs/heads/main'
        run: vercel build --prod --token=$VERCEL_TOKEN
        env:
          PUBLIC_API_URL: https://api.creative-it.com
          PUBLIC_AI_PLAYGROUND_URL: ${{ needs.deploy-cdk.outputs.ai_playground_url }}

      - name: Build (preview)
        if: github.ref == 'refs/heads/dev'
        run: vercel build --token=$VERCEL_TOKEN
        env:
          PUBLIC_API_URL: https://api.gw.dev.creative-it.com
          PUBLIC_AI_PLAYGROUND_URL: ${{ needs.deploy-cdk.outputs.ai_playground_url }}

      - name: Deploy (production)
        if: github.ref == 'refs/heads/main'
        run: vercel deploy --prebuilt --prod --token=$VERCEL_TOKEN

      - name: Deploy (preview)
        if: github.ref == 'refs/heads/dev'
        run: vercel deploy --prebuilt --token=$VERCEL_TOKEN
