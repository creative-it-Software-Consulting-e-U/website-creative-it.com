name: Deploy

on:
  push:
    branches: [main, dev]

concurrency:
  group: deploy-${{ github.ref }}
  cancel-in-progress: true

jobs:
  deploy-cdk:
    runs-on: ubuntu-latest
    outputs:
      ai_playground_url: ${{ steps.cdk-deploy.outputs.ai_playground_url }}
      tech_advisor_url: ${{ steps.cdk-deploy.outputs.tech_advisor_url }}
      knowledge_bot_url: ${{ steps.cdk-deploy.outputs.knowledge_bot_url }}
      agent_visualizer_url: ${{ steps.cdk-deploy.outputs.agent_visualizer_url }}
      website_remix_url: ${{ steps.cdk-deploy.outputs.website_remix_url }}
      live_translation_url: ${{ steps.cdk-deploy.outputs.live_translation_url }}
      blog_table_name: ${{ steps.cdk-deploy.outputs.blog_table_name }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: infra/package-lock.json

      - name: Install CDK dependencies
        run: npm ci
        working-directory: infra

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ github.ref == 'refs/heads/main' && secrets.AWS_ACCESS_KEY_ID_PROD || secrets.AWS_ACCESS_KEY_ID_GW }}
          aws-secret-access-key: ${{ github.ref == 'refs/heads/main' && secrets.AWS_SECRET_ACCESS_KEY_PROD || secrets.AWS_SECRET_ACCESS_KEY_GW }}
          aws-region: eu-central-1

      - name: CDK deploy
        id: cdk-deploy
        run: |
          GITHUB_TOKEN=${{ secrets.GH_PAT_SCHEDULER }} WEBHOOK_SECRET=${{ github.ref == 'refs/heads/main' && secrets.WEBHOOK_SECRET_PROD || secrets.WEBHOOK_SECRET_GW }} npx cdk deploy -c env=${{ github.ref == 'refs/heads/main' && 'prod' || 'gw' }} --require-approval never --outputs-file cdk-outputs.json
          echo "ai_playground_url=$(jq -r '.ContactApiStack.AiPlaygroundUrl // empty' cdk-outputs.json)" >> "$GITHUB_OUTPUT"
          echo "tech_advisor_url=$(jq -r '.ContactApiStack.TechAdvisorUrl // empty' cdk-outputs.json)" >> "$GITHUB_OUTPUT"
          echo "knowledge_bot_url=$(jq -r '.ContactApiStack.KnowledgeBotUrl // empty' cdk-outputs.json)" >> "$GITHUB_OUTPUT"
          echo "agent_visualizer_url=$(jq -r '.ContactApiStack.AgentVisualizerUrl // empty' cdk-outputs.json)" >> "$GITHUB_OUTPUT"
          echo "website_remix_url=$(jq -r '.ContactApiStack.WebsiteRemixUrl // empty' cdk-outputs.json)" >> "$GITHUB_OUTPUT"
          echo "live_translation_url=$(jq -r '.ContactApiStack.LiveTranslationUrl // empty' cdk-outputs.json)" >> "$GITHUB_OUTPUT"
          echo "blog_table_name=$(jq -r '.ContactApiStack.BlogTableName // empty' cdk-outputs.json)" >> "$GITHUB_OUTPUT"
        working-directory: infra

  deploy-vercel:
    needs: deploy-cdk
    runs-on: ubuntu-latest
    env:
      VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
      VERCEL_ORG_ID: ${{ secrets.VERCEL_ORG_ID }}
      VERCEL_PROJECT_ID: ${{ secrets.VERCEL_PROJECT_ID }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Install Vercel CLI
        run: npm install -g vercel

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ github.ref == 'refs/heads/main' && secrets.AWS_ACCESS_KEY_ID_PROD || secrets.AWS_ACCESS_KEY_ID_GW }}
          aws-secret-access-key: ${{ github.ref == 'refs/heads/main' && secrets.AWS_SECRET_ACCESS_KEY_PROD || secrets.AWS_SECRET_ACCESS_KEY_GW }}
          aws-region: eu-central-1

      - name: Fetch blog articles from DynamoDB
        if: needs.deploy-cdk.outputs.blog_table_name != ''
        run: |
          aws dynamodb scan \
            --table-name "${{ needs.deploy-cdk.outputs.blog_table_name }}" \
            --projection-expression "slug, title, brief, publishedAt, #u, coverImage, readTimeInMinutes, tags" \
            --expression-attribute-names '{"#u":"url"}' \
            --output json \
          | jq '[.Items[] | {
              slug: .slug.S,
              title: .title.S,
              brief: .brief.S,
              publishedAt: .publishedAt.S,
              url: .url.S,
              coverImage: (.coverImage.S // .coverImage.NULL // null | if . == true then null else . end),
              readTimeInMinutes: (.readTimeInMinutes.N | tonumber),
              tags: [.tags.L[]?.S // empty]
            }]' > public/blog-slugs.json
          echo "Blog articles written to public/blog-slugs.json:"
          cat public/blog-slugs.json | jq length

      - name: Pull Vercel environment
        run: vercel pull --yes --token=$VERCEL_TOKEN

      - name: Build (production)
        if: github.ref == 'refs/heads/main'
        run: vercel build --prod --token=$VERCEL_TOKEN
        env:
          PUBLIC_API_URL: https://api.creative-it.com
          PUBLIC_AI_PLAYGROUND_URL: ${{ needs.deploy-cdk.outputs.ai_playground_url }}
          PUBLIC_TECH_ADVISOR_URL: ${{ needs.deploy-cdk.outputs.tech_advisor_url }}
          PUBLIC_KNOWLEDGE_BOT_URL: ${{ needs.deploy-cdk.outputs.knowledge_bot_url }}
          PUBLIC_AGENT_VISUALIZER_URL: ${{ needs.deploy-cdk.outputs.agent_visualizer_url }}
          PUBLIC_WEBSITE_REMIX_URL: ${{ needs.deploy-cdk.outputs.website_remix_url }}
          PUBLIC_LIVE_TRANSLATION_URL: ${{ needs.deploy-cdk.outputs.live_translation_url }}

      - name: Build (preview)
        if: github.ref == 'refs/heads/dev'
        run: vercel build --token=$VERCEL_TOKEN
        env:
          PUBLIC_API_URL: https://api.gw.dev.creative-it.com
          PUBLIC_AI_PLAYGROUND_URL: ${{ needs.deploy-cdk.outputs.ai_playground_url }}
          PUBLIC_TECH_ADVISOR_URL: ${{ needs.deploy-cdk.outputs.tech_advisor_url }}
          PUBLIC_KNOWLEDGE_BOT_URL: ${{ needs.deploy-cdk.outputs.knowledge_bot_url }}
          PUBLIC_AGENT_VISUALIZER_URL: ${{ needs.deploy-cdk.outputs.agent_visualizer_url }}
          PUBLIC_WEBSITE_REMIX_URL: ${{ needs.deploy-cdk.outputs.website_remix_url }}
          PUBLIC_LIVE_TRANSLATION_URL: ${{ needs.deploy-cdk.outputs.live_translation_url }}

      - name: Deploy (production)
        if: github.ref == 'refs/heads/main'
        run: vercel deploy --prebuilt --prod --token=$VERCEL_TOKEN

      - name: Deploy (preview)
        if: github.ref == 'refs/heads/dev'
        run: vercel deploy --prebuilt --token=$VERCEL_TOKEN
