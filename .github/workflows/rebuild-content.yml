name: Rebuild Content

on:
  repository_dispatch:
    types: [hashnode-publish]
  workflow_dispatch:
    inputs:
      environment:
        description: "Deploy target"
        required: true
        default: "production"
        type: choice
        options:
          - production
          - preview

concurrency:
  group: deploy-refs/heads/main
  cancel-in-progress: true

jobs:
  deploy-vercel:
    runs-on: ubuntu-latest
    env:
      VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
      VERCEL_ORG_ID: ${{ secrets.VERCEL_ORG_ID }}
      VERCEL_PROJECT_ID: ${{ secrets.VERCEL_PROJECT_ID }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Install Vercel CLI
        run: npm install -g vercel

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID_PROD }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY_PROD }}
          aws-region: eu-central-1

      - name: Fetch Lambda URLs from CDK stack
        id: cdk-urls
        run: |
          OUTPUTS=$(aws cloudformation describe-stacks --stack-name ContactApiStack --query 'Stacks[0].Outputs' --output json)
          echo "ai_playground_url=$(echo $OUTPUTS | jq -r '.[] | select(.OutputKey=="AiPlaygroundUrl") | .OutputValue')" >> "$GITHUB_OUTPUT"
          echo "tech_advisor_url=$(echo $OUTPUTS | jq -r '.[] | select(.OutputKey=="TechAdvisorUrl") | .OutputValue')" >> "$GITHUB_OUTPUT"
          echo "knowledge_bot_url=$(echo $OUTPUTS | jq -r '.[] | select(.OutputKey=="KnowledgeBotUrl") | .OutputValue')" >> "$GITHUB_OUTPUT"
          echo "agent_visualizer_url=$(echo $OUTPUTS | jq -r '.[] | select(.OutputKey=="AgentVisualizerUrl") | .OutputValue')" >> "$GITHUB_OUTPUT"
          echo "website_remix_url=$(echo $OUTPUTS | jq -r '.[] | select(.OutputKey=="WebsiteRemixUrl") | .OutputValue')" >> "$GITHUB_OUTPUT"
          echo "live_translation_url=$(echo $OUTPUTS | jq -r '.[] | select(.OutputKey=="LiveTranslationUrl") | .OutputValue')" >> "$GITHUB_OUTPUT"
          echo "blog_table_name=$(echo $OUTPUTS | jq -r '.[] | select(.OutputKey=="BlogTableName") | .OutputValue')" >> "$GITHUB_OUTPUT"

      - name: Fetch blog articles from DynamoDB
        run: |
          aws dynamodb scan \
            --table-name "${{ steps.cdk-urls.outputs.blog_table_name }}" \
            --projection-expression "slug, title, brief, publishedAt, #u, coverImage, readTimeInMinutes, tags" \
            --expression-attribute-names '{"#u":"url"}' \
            --output json \
          | jq '[.Items[] | {
              slug: .slug.S,
              title: .title.S,
              brief: .brief.S,
              publishedAt: .publishedAt.S,
              url: .url.S,
              coverImage: (.coverImage.S // .coverImage.NULL // null | if . == true then null else . end),
              readTimeInMinutes: (.readTimeInMinutes.N | tonumber),
              tags: [.tags.L[]?.S // empty]
            }]' > public/blog-slugs.json
          echo "Blog articles written to public/blog-slugs.json:"
          cat public/blog-slugs.json | jq length

      - name: Pull Vercel environment
        run: vercel pull --yes --environment=production --token=$VERCEL_TOKEN

      - name: Build & Deploy
        run: |
          vercel build --prod --token=$VERCEL_TOKEN
          vercel deploy --prebuilt --prod --token=$VERCEL_TOKEN
        env:
          PUBLIC_API_URL: https://api.creative-it.com
          PUBLIC_AI_PLAYGROUND_URL: ${{ steps.cdk-urls.outputs.ai_playground_url }}
          PUBLIC_TECH_ADVISOR_URL: ${{ steps.cdk-urls.outputs.tech_advisor_url }}
          PUBLIC_KNOWLEDGE_BOT_URL: ${{ steps.cdk-urls.outputs.knowledge_bot_url }}
          PUBLIC_AGENT_VISUALIZER_URL: ${{ steps.cdk-urls.outputs.agent_visualizer_url }}
          PUBLIC_WEBSITE_REMIX_URL: ${{ steps.cdk-urls.outputs.website_remix_url }}
          PUBLIC_LIVE_TRANSLATION_URL: ${{ steps.cdk-urls.outputs.live_translation_url }}
